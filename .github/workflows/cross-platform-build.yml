name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    defaults:
      run:
        working-directory: generator/main

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: generator/main/pom.xml

      - name: Build executable JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify executable JAR
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "target/dataset-generator.jar")) {
            throw "Maven did not create target/dataset-generator.jar"
          }
